# Local preview server that mimics GitHub Pages behaviour.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/xml;

  error_page 404 /404.html;

  location / {
    try_files $uri $uri/ $uri.html =404;
  }

  # Astro fingerprints everything in /_astro, so it can be cached forever.
  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
