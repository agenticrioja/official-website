name: CI

on:
  pull_request:
  push:
    branches-ignore: [main] # main is tested by deploy.yml, which calls this workflow
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Type-check, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # pnpm version comes from packageManager in package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

      - name: Type-check and build
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end and accessibility tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build and smoke-test the image
        run: |
          docker build -t agenticrioja .
          docker run -d --rm -p 8080:80 --name site agenticrioja
          for _ in $(seq 1 10); do curl -fs http://localhost:8080/ >/dev/null && break; sleep 1; done
          # Check stable markers, not marketing copy, so content edits don't break the smoke test.
          page=$(curl -fs http://localhost:8080/)
          grep -q '<title>Agentic Rioja' <<<"$page"
          css=$(grep -o '/_astro/[^"]*\.css' <<<"$page" | head -1)
          curl -fs "http://localhost:8080$css" >/dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/missing)" = 404
          docker stop site
